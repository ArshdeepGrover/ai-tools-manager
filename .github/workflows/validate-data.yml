name: Validate Data

on:
  pull_request:
    paths:
      - "data/links.json"
      - "data/contributors.json"
  # Also validate the merge result. PR runs only check the branch head, so
  # damage introduced while resolving a conflict reaches master unchecked.
  push:
    branches:
      - master
      - production
    paths:
      - "data/links.json"
      - "data/contributors.json"

jobs:
  validate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Validate all data files
        run: |
          echo "🔍 Running data validation..."

          # Check if links.json exists and validate
          if [ -f "data/links.json" ]; then
            echo "📝 Validating links.json..."
            node scripts/validate-links.js --duplicates-only
          fi

          # Check if contributors.json exists and validate  
          if [ -f "data/contributors.json" ]; then
            echo "👥 Validating contributors.json..."
            node scripts/validate-contributors.js --quick
          fi

          echo "✅ All validations completed successfully!"

      - name: Comment on PR if validation fails
        # Only on pull_request: context.issue.number and
        # context.payload.pull_request do not exist on a push event.
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // pull_request.changed_files is a COUNT, not a list - calling
            // .includes() on it throws. Fetch the actual filenames instead.
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const changedFiles = files.map((f) => f.filename);
            let message = '❌ **Data Validation Failed**\n\n';

            if (changedFiles.includes('data/links.json')) {
              message += '• **Links**: Duplicate titles or URLs detected\n';
            }

            if (changedFiles.includes('data/contributors.json')) {
              message += '• **Contributors**: Invalid or missing contributor data\n';
            }

            message += '\nCheck the workflow logs for detailed error messages.\n';
            message += 'Please fix these issues and push your changes again.\n\n';
            message += '**Local Testing:**\n';
            message += '• Links: `node scripts/validate-links.js --duplicates-only`\n';
            message += '• Contributors: `node scripts/validate-contributors.js --quick`';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Comment on PR if validation passes
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // pull_request.changed_files is a COUNT, not a list - calling
            // .includes() on it throws. Fetch the actual filenames instead.
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const changedFiles = files.map((f) => f.filename);
            let message = '✅ **Data Validation Passed**\n\n';

            if (changedFiles.includes('data/links.json')) {
              message += '• **Links**: No duplicate titles or URLs found\n';
            }

            if (changedFiles.includes('data/contributors.json')) {
              message += '• **Contributors**: All contributor data is valid\n';
            }

            message += '\nReady for review and merge! 🚀';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })
